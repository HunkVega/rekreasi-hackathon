<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISWA-RECRON: Recreatie Puzzel</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-slate-200 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4 select-none">

    <div id="app" class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden h-[700px] flex flex-col relative border-4 border-slate-50">

        <!-- SCREEN 1: LOBBY -->
        <div id="screen-lobby" class="flex-1 flex flex-col p-6 bg-slate-50 overflow-y-auto">
            <div class="mb-8 mt-4 text-center">
                <h1 class="text-3xl font-black text-slate-800 tracking-tight mb-2">Kies je missie!</h1>
                <p class="text-slate-500 font-medium">Help om de chaos op het vakantiepark op te lossen.</p>
            </div>
            
            <!-- List misi akan di-generate via JavaScript -->
            <div class="space-y-4" id="mission-list"></div>
        </div>

        <!-- SCREEN 2: PUZZLE ROOM -->
        <div id="screen-puzzle" class="hidden-screen flex-1 flex flex-col p-6 bg-slate-800 text-white relative">
            <div class="flex justify-between items-center mb-6 z-20">
                <button onclick="backToLobby()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-full font-bold text-sm transition-colors">
                    ← Terug
                </button>
                <span id="puzzle-title" class="font-black text-lg">Actieve Missie</span>
            </div>

            <p id="puzzle-instruction" class="text-center font-medium text-slate-300 mb-8 z-20">Instructie...</p>

            <div class="relative flex-1 bg-slate-900 rounded-2xl border-4 border-slate-700 overflow-hidden shadow-inner flex items-center justify-center">
                <div id="dropzone" class="absolute w-32 h-32 border-4 border-dashed border-slate-600 rounded-2xl flex items-center justify-center bg-slate-800/50 transition-colors z-0">
                    <span id="dropzone-icon" class="text-5xl opacity-50 grayscale">📡</span>
                </div>

                <div id="draggable-item" class="draggable absolute z-10 p-2">
                    <div id="item-icon" class="text-6xl filter drop-shadow-lg hover:scale-110 transition-transform">🔌</div>
                </div>
            </div>
            
            <div id="success-overlay" class="absolute inset-0 bg-emerald-500/90 z-30 hidden flex-col items-center justify-center animate-pop backdrop-blur-sm">
                <div class="text-8xl mb-4">🎉</div>
                <h2 class="text-3xl font-black mb-2 shadow-sm text-center">Gelukt!</h2>
                <p id="success-message" class="text-emerald-50 font-bold text-center px-6 mb-8">Goed gedaan!</p>
                <button onclick="backToLobby()" class="bg-white text-emerald-700 font-black px-8 py-4 rounded-full shadow-lg hover:scale-105 active:scale-95 transition-all">
                    Kies andere missie
                </button>
            </div>
        </div>

    </div>

    <!-- Hubungkan Data dan Logika Mekanik -->
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/puzzle.js"></script>
</body>
</html>
