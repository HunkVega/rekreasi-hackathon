<!-- SCENE 3: RUANG PUZZLE (PROFESIONAL) -->
        <div id="scene-puzzle" class="scene flex-col p-6 bg-slate-900 text-white relative">
            <div class="flex justify-between items-center mb-4 z-20 shrink-0 mt-2">
                <button onclick="closePuzzle()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-full font-bold text-sm transition-colors">
                    ← Kaart
                </button>
                <span id="puzzle-title" class="font-black text-lg text-blue-400">Missie</span>
            </div>

            <p id="puzzle-instruction" class="text-center font-medium text-slate-300 mb-4 z-20 shrink-0 text-sm">Instructie...</p>

            <!-- SCENE VISUAL MASALAH (DROPZONE UTAMA) -->
            <div id="dropzone" class="relative flex-1 bg-slate-800 rounded-3xl border-4 border-dashed border-slate-600 overflow-hidden shadow-inner flex flex-col items-center justify-center mb-6 transition-colors duration-300">
                <!-- Visualisasi Masalah (Bisa diganti image tag <img> nantinya) -->
                <div id="problem-visual" class="text-7xl mb-4 filter drop-shadow-2xl">🔥</div>
                <div id="dropzone-label" class="bg-slate-900/50 px-4 py-2 rounded-full text-slate-300 font-bold text-sm">
                    Tarik alat ke sini
                </div>

                <!-- Notifikasi Error (Muncul jika salah alat) -->
                <div id="error-toast" class="absolute top-4 bg-red-500 text-white px-4 py-2 rounded-xl font-bold text-sm opacity-0 transition-opacity duration-300 transform -translate-y-4">
                    Salah alat!
                </div>
            </div>

            <!-- TOOLBOX / INVENTORY ALAT -->
            <div class="bg-slate-800 p-4 rounded-3xl border-2 border-slate-700">
                <p class="text-xs text-slate-400 font-bold text-center mb-3 uppercase tracking-wider">Kies je gereedschap</p>
                <div id="toolbox" class="flex justify-center gap-4">
                    <!-- Alat-alat akan di-generate oleh JavaScript di sini -->
                </div>
            </div>
            
            <!-- LAYAR SUKSES -->
            <div id="success-overlay" class="absolute inset-0 bg-emerald-600/95 z-50 hidden flex-col items-center justify-center animate-pop backdrop-blur-md rounded-3xl">
                <div class="text-8xl mb-6 drop-shadow-lg">🎉</div>
                <h2 class="text-4xl font-black mb-2 shadow-sm text-center text-white">Gelukt!</h2>
                <p id="success-message" class="text-emerald-100 font-bold text-center px-6 mb-8 text-lg">Goed gedaan!</p>
                <button onclick="closePuzzle()" class="bg-white text-emerald-800 font-black px-10 py-4 rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-all">
                    Terug naar kaart
                </button>
            </div>
        </div>
