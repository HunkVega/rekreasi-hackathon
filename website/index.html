<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beleef de Recreatiebranche</title>
    
    <!-- Tailwind CSS (Bisa diganti dengan build lokal jika ada Node.js) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dominant: '#F1F5F9', // 60% background
                        secondary: '#FFFFFF', // 30% card/content
                        accent: '#EA580C',    // 10% call to action
                        textDark: '#1E293B',
                        textLight: '#64748B'
                    }
                }
            }
        }
    </script>
    
    <!-- Link ke CSS eksternal -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Pendaftaran Service Worker untuk Mode Offline -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered!', reg))
                .catch(err => console.error('Service Worker failed!', err));
        }
    </script>
</head>
<body class="bg-dominant text-textDark min-h-screen flex items-center justify-center font-sans p-0 sm:p-4 selection:bg-accent selection:text-white">

    <div class="w-full max-w-md h-[100dvh] sm:h-[85vh] bg-secondary sm:rounded-3xl sm:shadow-2xl overflow-hidden relative flex flex-col">
        
        <!-- SCREEN 1: HOME -->
        <div id="screen-home" class="absolute inset-0 flex flex-col items-center justify-center p-8 bg-secondary z-20">
            <div class="w-24 h-24 bg-dominant rounded-full flex items-center justify-center mb-6 shadow-inner">
                <span class="text-4xl">🏕️</span>
            </div>
            <h1 class="text-3xl font-extrabold text-center mb-4 leading-tight">
                Beleef de Recreatiebranche
            </h1>
            <p class="text-center text-textLight mb-10 font-medium">
                Ontdek veel verschillende banen — in één korte ronde.
            </p>
            <button id="btn-start" class="w-full bg-accent hover:bg-orange-500 text-white font-bold text-xl py-4 rounded-2xl shadow-[0_8px_20px_rgba(234,88,12,0.3)] transition-all active:scale-95 animate-pulse">
                START JOUW AVONTUUR
            </button>
            <div id="secret-reset" class="absolute top-0 left-0 w-16 h-16 opacity-0 cursor-default"></div>
        </div>

        <!-- SCREEN 2: GAMEPLAY -->
        <div id="screen-game" class="absolute inset-0 hidden flex flex-col z-10 bg-dominant">
            <div class="relative h-1/2 w-full bg-gray-200">
                <img id="vn-image" src="" alt="Scene" class="w-full h-full object-cover transition-opacity duration-300">
                <div class="absolute bottom-0 w-full h-24 bg-gradient-to-t from-secondary to-transparent"></div>
            </div>
            <div class="flex-1 bg-secondary w-full p-6 flex flex-col rounded-t-3xl -mt-6 relative z-10">
                <div class="mb-4">
                    <span class="text-xs font-bold uppercase tracking-wider text-accent mb-1 block" id="vn-tag"></span>
                    <p id="vn-dialogue" class="text-lg font-semibold text-textDark leading-snug"></p>
                </div>
                <div id="vn-choices" class="mt-auto space-y-3 pb-4"></div>
            </div>
        </div>

        <!-- SCREEN 3: RESULT -->
        <div id="screen-result" class="absolute inset-0 hidden flex-col items-center justify-center p-8 bg-secondary z-30">
            <h2 class="text-xl text-textLight font-bold uppercase tracking-widest mb-2">Jouw Profiel</h2>
            <h1 id="result-title" class="text-4xl font-extrabold text-accent text-center mb-4"></h1>
            <p id="result-desc" class="text-center text-textDark font-medium mb-10">
                Jij bent de held op de achtergrond. Je houdt van techniek en zorgt dat alles soepel draait.
            </p>
            <button id="btn-share" class="w-full bg-dominant text-textDark font-bold text-lg py-4 rounded-2xl mb-4 hover:bg-gray-200 transition-colors border-2 border-gray-200">
                🔗 Deel met vrienden
            </button>
            <button id="btn-restart" class="w-full bg-accent text-white font-bold text-lg py-4 rounded-2xl shadow-lg hover:bg-orange-500 transition-transform active:scale-95">
                Speel Opnieuw
            </button>
        </div>
    </div>

    <!-- Pemuatan Logika Utama -->
    <script src="app.js"></script>
</body>
</html>
