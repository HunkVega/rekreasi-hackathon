<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beleef de Recreatiebranche</title>
    <!-- Menggunakan Tailwind CSS untuk mempermudah palet warna dan responsivitas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Konfigurasi Aturan 60-30-10
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dominant: '#F1F5F9', // 60%: Slate-100 (Latar belakang utama, netral dan tenang)
                        secondary: '#FFFFFF', // 30%: Putih (Area konten, kotak dialog, batas yang jelas)
                        accent: '#EA580C',    // 10%: Orange-600 (Tombol aksi, menarik mata dari jarak 3 meter)
                        textDark: '#1E293B',
                        textLight: '#64748B'
                    }
                }
            }
        }
    </script>
    <style>
        /* Animasi transisi antar skenario bergaya Visual Novel */
        .vn-enter {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* Menghilangkan scrollbar tapi tetap bisa di-scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-dominant text-textDark min-h-screen flex items-center justify-center font-sans p-0 sm:p-4 selection:bg-accent selection:text-white">

    <!-- Container Utama: Responsif (Penuh di HP, berbentuk kartu di Desktop/Tablet Booth) -->
    <div class="w-full max-w-md h-[100dvh] sm:h-[85vh] bg-secondary sm:rounded-3xl sm:shadow-2xl overflow-hidden relative flex flex-col">
        
        <!-- ============================================== -->
        <!-- SCREEN 1: THE HOOK (Layar Utama)               -->
        <!-- ============================================== -->
        <div id="screen-home" class="absolute inset-0 flex flex-col items-center justify-center p-8 bg-secondary z-20">
            <div class="w-24 h-24 bg-dominant rounded-full flex items-center justify-center mb-6 shadow-inner">
                <span class="text-4xl">🏕️</span>
            </div>
            <h1 class="text-3xl font-extrabold text-center mb-4 leading-tight">
                Beleef de Recreatiebranche
            </h1>
            <p class="text-center text-textLight mb-10 font-medium">
                Ontdek veel verschillende banen — in één korte ronde.
            </p>
            
            <!-- Tombol Accent (10%) -->
            <button onclick="startGame()" class="w-full bg-accent hover:bg-orange-500 text-white font-bold text-xl py-4 rounded-2xl shadow-[0_8px_20px_rgba(234,88,12,0.3)] transition-all active:scale-95 animate-pulse">
                START JOUW AVONTUUR
            </button>

            <!-- Mode Staf Tersembunyi untuk reset di lantai acara -->
            <div onclick="secretReset()" class="absolute top-0 left-0 w-16 h-16 opacity-0 cursor-default"></div>
        </div>

        <!-- ============================================== -->
        <!-- SCREEN 2: VISUAL NOVEL GAMEPLAY                -->
        <!-- ============================================== -->
        <div id="screen-game" class="absolute inset-0 hidden flex flex-col z-10 bg-dominant">
            <!-- Visual / Scene Image -->
            <div class="relative h-1/2 w-full bg-gray-200">
                <img id="vn-image" src="" alt="Scene" class="w-full h-full object-cover transition-opacity duration-300">
                <!-- Overlay gradien agar teks/tombol di bawahnya menyatu -->
                <div class="absolute bottom-0 w-full h-24 bg-gradient-to-t from-secondary to-transparent"></div>
            </div>

            <!-- Dialogue & Choices (30% Area) -->
            <div class="flex-1 bg-secondary w-full p-6 flex flex-col rounded-t-3xl -mt-6 relative z-10">
                <div class="mb-4">
                    <span class="text-xs font-bold uppercase tracking-wider text-accent mb-1 block" id="vn-tag">Situatie 1/3</span>
                    <p id="vn-dialogue" class="text-lg font-semibold text-textDark leading-snug vn-enter">
                        <!-- Teks kasus akan masuk ke sini -->
                    </p>
                </div>
                
                <!-- Opsi Pilihan (Aksi insting cepat) -->
                <div id="vn-choices" class="mt-auto space-y-3 pb-4">
                    <!-- Tombol di-generate via JS -->
                </div>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- SCREEN 3: RESULT & SHARE (Satu Tautan)         -->
        <!-- ============================================== -->
        <div id="screen-result" class="absolute inset-0 hidden flex-col items-center justify-center p-8 bg-secondary z-30">
            <h2 class="text-xl text-textLight font-bold uppercase tracking-widest mb-2">Jouw Profiel</h2>
            <h1 id="result-title" class="text-4xl font-extrabold text-accent text-center mb-4">De Fixer</h1>
            <p id="result-desc" class="text-center text-textDark font-medium mb-10">
                Jij bent de held op de achtergrond. Je houdt van techniek en zorgt dat alles soepel draait.
            </p>
            
            <!-- Tombol Berbagi tanpa mengumpulkan data pribadi -->
            <button onclick="shareLink()" class="w-full bg-dominant text-textDark font-bold text-lg py-4 rounded-2xl mb-4 hover:bg-gray-200 transition-colors border-2 border-gray-200">
                🔗 Deel met vrienden
            </button>
            <button onclick="resetGame()" class="w-full bg-accent text-white font-bold text-lg py-4 rounded-2xl shadow-lg hover:bg-orange-500 transition-transform active:scale-95">
                Speel Opnieuw
            </button>
        </div>

    </div>

    <!-- Logika Permainan -->
    <script>
        // Database Kasus Visual Novel (Cepat & Sederhana)
        const vnCases = [
            {
                image: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=600&q=80",
                tag: "DE Jachthaven",
                dialogue: "Er is paniek! Een gast heeft een lekke boot. De boot zinkt langzaam. Wat is jouw eerste reactie?",
                choices: [
                    { text: "Pak mijn gereedschap en repareer het lek direct.", profile: "Techniek" },
                    { text: "Stel de gast gerust en regel een vervangende boot.", profile: "Frontoffice" }
                ]
            },
            {
                image: "https://images.unsplash.com/photo-1527529482837-4698179dc6ce?auto=format&fit=crop&w=600&q=80",
                tag: "DE CAMPING",
                dialogue: "Het regent keihard tijdens de grote camping-barbecue. Iedereen rent naar binnen.",
                choices: [
                    { text: "Verplaats het feest naar binnen en start de muziek!", profile: "Animatie" },
                    { text: "Pas de menu's aan en serveer warme chocomel.", profile: "Horeca" }
                ]
            },
            {
                image: "https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=600&q=80",
                tag: "HET VAKANTIEPARK",
                dialogue: "Een influencer wil gratis verblijven in ruil voor promotie. Wat beslis je?",
                choices: [
                    { text: "Ik check hun bereik en onderhandel een contract.", profile: "Marketing" },
                    { text: "Ik regel een VIP-huisje zodat ze een topsfeer ervaren.", profile: "Management" }
                ]
            }
        ];

        let currentCase = 0;
        let userProfiles = [];
        let autoResetTimer;

        // Navigasi Layar
        function showScreen(screenId) {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function startGame() {
            currentCase = 0;
            userProfiles = [];
            showScreen('screen-game');
            loadCase();
        }

        function loadCase() {
            if (currentCase >= vnCases.length) {
                showResult();
                return;
            }

            const data = vnCases[currentCase];
            document.getElementById('vn-image').src = data.image;
            document.getElementById('vn-tag').innerText = `${data.tag} (${currentCase + 1}/${vnCases.length})`;
            
            // Efek animasi masuk
            const dialogueEl = document.getElementById('vn-dialogue');
            dialogueEl.classList.remove('vn-enter');
            void dialogueEl.offsetWidth; // Trigger reflow
            dialogueEl.classList.add('vn-enter');
            dialogueEl.innerText = data.dialogue;

            // Generate Tombol Pilihan
            const choicesContainer = document.getElementById('vn-choices');
            choicesContainer.innerHTML = '';
            
            data.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-dominant hover:bg-gray-200 border border-gray-200 text-textDark font-medium p-4 rounded-xl transition-colors active:scale-[0.98]";
                btn.innerText = choice.text;
                btn.onclick = () => selectChoice(choice.profile);
                choicesContainer.appendChild(btn);
            });
        }

        function selectChoice(profile) {
            userProfiles.push(profile);
            currentCase++;
            loadCase();
        }

        function showResult() {
            showScreen('screen-result');
            // Logika sederhana: ambil profil yang terakhir dipilih sebagai contoh
            const finalProfile = userProfiles[userProfiles.length - 1]; 
            document.getElementById('result-title').innerText = `De ${finalProfile} Expert`;
            
            // Reset otomatis untuk lantai acara
            clearTimeout(autoResetTimer);
            autoResetTimer = setTimeout(() => {
                resetGame();
            }, 20000); // 20 detik idle, kembali ke layar utama
        }

        function resetGame() {
            clearTimeout(autoResetTimer);
            showScreen('screen-home');
        }

        // Fitur Berbagi (Syarat: Satu tautan untuk sekolah mbo-vmbo)[cite: 2]
        function shareLink() {
            const tempUrl = window.location.href;
            navigator.clipboard.writeText(tempUrl).then(() => {
                alert("Link gekopieerd! Deel het met je vrienden."); // Pop-up Belanda
            });
        }

        // Mode rahasia jika stan macet
        function secretReset() {
            resetGame();
        }
    </script>
</body>
</html>
